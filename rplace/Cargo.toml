[package]
name = "rplace"
version = "0.2.0"
edition = "2024"

[workspace]
members = ["plugins/lua", "plugins/regex"]
resolver = "3"

[dependencies]
crossterm = "0.29"
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
rayon = "1.12.0"
walkdir = "2.5.0"
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
libloading = "0.8"
path-clean = "1.0.1"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.3"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.19"
features = "0.10.0"
derive = "1.0.0"
